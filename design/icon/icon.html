<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html,body{margin:0;background:#000}
  .i{width:1024px;height:1024px;position:relative;overflow:hidden;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
  /* A: the q, with a record light */
  .a{background:#0b0b0c;color:#f4f2ee}
  .q{-webkit-text-stroke:6px currentColor;paint-order:stroke fill}
  .a .q{font-size:820px;line-height:1;letter-spacing:-.04em;transform:translate(-60px,-110px)}
  .a .dot{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffb547;right:150px;top:190px;box-shadow:0 0 90px #ffb54788}
  /* B: amber tile, black q */
  .b{background:#ffb547;color:#0b0b0c}
  .b .q{font-size:820px;line-height:1;letter-spacing:-.04em;transform:translate(-10px,-110px)}
  .b .bars{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;gap:26px}
  /* C: rhyme stack */
  .c{background:#0b0b0c;color:#f4f2ee;align-content:center;justify-items:start;padding-left:120px;box-sizing:border-box}
  .c div{font-size:200px;line-height:.92;letter-spacing:-.03em}
  .c .o1{opacity:1}.c .o2{opacity:.55}.c .o3{opacity:.28}
  .c .acc{color:#ffb547}
</style>
<div class="i a" id="A"><div class="q">q</div><div class="dot"></div></div>
<div class="i b" id="B"><div class="q">q</div></div>
<div class="i c" id="C"><div class="o1">dr<span class="acc">ama</span></div><div class="o2">k<span class="acc">arma</span></div><div class="o3">f<span class="acc">armer</span></div></div>
